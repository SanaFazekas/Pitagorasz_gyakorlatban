<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pitagorasz-tétele - Szöveges feladatok</title>
  <style>
    :root {
      --primary: #2b5c8f;
      --primary-hover: #1d4066;
      --bg-color: #f4f7f9;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #dcdfe6;
      --success: #2e7d32;
      --success-bg: #e8f5e9;
      --error: #c62828;
      --error-bg: #ffebee;
      --accent: #f57c00;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      max-width: 1000px;
      width: 100%;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 25px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 2px solid var(--bg-color);
      padding-bottom: 15px;
    }

    header h1 {
      color: var(--primary);
      font-size: 1.8rem;
    }

    header p {
      color: #666;
      font-size: 0.95rem;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 25px;
    }

    @media (max-width: 768px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: #fafbfc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .panel h2 {
      font-size: 1.2rem;
      color: var(--primary);
      margin-bottom: 15px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 5px;
    }

    .form-group input[type="text"], 
    .form-group input[type="number"], 
    .form-group select {
      width: 100%;
      padding: 9px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 5px;
    }

    .root-hint {
      font-size: 0.78rem;
      color: #666;
      margin-top: 4px;
      font-style: italic;
    }

    .workspace {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .task-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      background: #fff;
    }

    .task-progress {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .task-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 10px;
      color: var(--primary);
    }

    .task-description {
      font-size: 1.05rem;
      margin-bottom: 20px;
      line-height: 1.5;
      background: #f9fbfd;
      padding: 15px;
      border-left: 4px solid var(--primary);
      border-radius: 4px;
    }

    .inputs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    .input-box label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }

    .input-with-unit {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .input-with-unit input {
      flex: 1;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
    }

    .input-with-unit select {
      width: 75px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .root-input-wrapper {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
    }

    .root-input-wrapper input {
      width: 50px !important;
      text-align: center;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      font-size: 0.9rem;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-success { background: var(--success); color: white; }
    .btn-success:hover { background: #1b5e20; }

    .btn-secondary { background: #6c757d; color: white; }
    .btn-secondary:hover { background: #5a6268; }

    .btn-outline { background: transparent; border: 1px solid var(--border); color: #333; }
    .btn-outline:hover { background: #e9ecef; }

    .feedback {
      padding: 15px;
      border-radius: 6px;
      display: none;
      margin-top: 15px;
    }

    .feedback.success {
      display: block;
      background: var(--success-bg);
      border: 1px solid var(--success);
      color: var(--success);
    }

    .feedback.error {
      display: block;
      background: var(--error-bg);
      border: 1px solid var(--error);
      color: var(--error);
    }

    .solution-steps {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #333;
      background: rgba(255,255,255,0.9);
      padding: 12px;
      border-radius: 4px;
      line-height: 1.6;
      border-left: 3px solid var(--primary);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 8px;
      max-width: 800px;
      width: 90%;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .history-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    .history-table th, .history-table td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
      font-size: 0.9rem;
    }

    .history-table th {
      background: #f4f7f9;
    }

    .tag-success { color: var(--success); font-weight: bold; }
    .tag-error { color: var(--error); font-weight: bold; }

    .summary-box {
      background: #f8f9fa;
      border: 1px solid var(--border);
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 15px;
      text-align: center;
    }

    .summary-box h3 {
      color: var(--primary);
      margin-bottom: 5px;
    }

    @media print {
      body * { visibility: hidden; }
      #printableArea, #printableArea * { visibility: visible; }
      #printableArea { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>Pitagorasz-tétele - Szöveges feladatok</h1>
    <p>Interaktív feladatgeneráló gyakorláshoz és teszteléshez</p>
  </header>

  <div class="main-grid">
    <aside class="panel">
      <div>
        <h2>Beállítások</h2>

        <div class="form-group">
          <label for="studentName">Tanuló neve:</label>
          <input type="text" id="studentName" placeholder="Pl. Kovács Péter">
        </div>

        <div class="form-group">
          <label for="workMode">Működési mód:</label>
          <select id="workMode">
            <option value="practice">Gyakorlás (azonnali ellenőrzés)</option>
            <option value="test">Teszt (sorozat végén értékelés)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="calcGoal">Keresett érték:</label>
          <select id="calcGoal">
            <option value="random">Vegyes (Befogó vagy Átfogó)</option>
            <option value="hypotenuse">Átfogó számítása</option>
            <option value="leg">Befogó számítása</option>
          </select>
        </div>

        <div class="form-group">
          <label for="taskCount">Feladatok száma:</label>
          <select id="taskCount">
            <option value="6">6 feladat</option>
            <option value="8">8 feladat</option>
            <option value="10" selected>10 feladat</option>
            <option value="12">12 feladat</option>
          </select>
        </div>

        <div class="form-group">
          <label class="checkbox-group">
            <input type="checkbox" id="useRootFormat" onchange="updateTaskInputFormat()"> Gyökös kiírás / pontos alak (pl. a√b)
          </label>
          <div class="root-hint">(egész szám esetén írd a gyök alá az 1-est)</div>
        </div>

        <div class="button-group" style="flex-direction: column;">
          <button class="btn-primary" onclick="startSession()">Új feladatsor indítása</button>
          <button class="btn-secondary" onclick="openHistoryModal()">PDF nyomtatás / Eredmények</button>
          <button class="btn-outline" onclick="openHistoryModal()">Eredmények áttekintése</button>
        </div>
      </div>
    </aside>

    <main class="workspace">
      <div class="task-card" id="taskCardContainer">
        <div class="task-progress" id="taskProgressText"></div>
        <div class="task-title" id="taskTitle">Feladat</div>
        <div class="task-description" id="taskText">Kattints az "Új feladatsor indítása" gombra a gyakorlás megkezdéséhez!</div>
        
        <div class="inputs-grid" id="inputsGrid"></div>

        <div class="button-group" id="actionButtonGroup" style="margin-top: 20px; display:none;">
          <button class="btn-success" id="submitBtn" onclick="submitCurrentAnswer()">Válasz ellenőrzése</button>
          <button class="btn-primary" id="nextBtn" onclick="nextTask()" style="display:none;">Következő feladat ➔</button>
        </div>

        <div id="feedback" class="feedback"></div>
      </div>
    </main>
  </div>
</div>
